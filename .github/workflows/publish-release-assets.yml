name: Publish Release Assets

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.9
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="$version"
            if [ -n "${{ inputs.release_name }}" ]; then
              release_name="${{ inputs.release_name }}"
            else
              release_name="DeepSea Chat $version"
            fi
          else
            tag_name="${GITHUB_REF_NAME}"
            release_name="DeepSea Chat $version"
          fi

          {
            echo "tag_name=$tag_name"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"

      - name: Verify installers exist
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          files=(
            "DeepSea Chat Setup ${version}.exe"
            "DeepSea Chat-${version}-arm64.dmg"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing expected asset: $file"
              exit 1
            fi
          done

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.release_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            DeepSea Chat Setup ${{ steps.version.outputs.version }}.exe
            DeepSea Chat-${{ steps.version.outputs.version }}-arm64.dmg
